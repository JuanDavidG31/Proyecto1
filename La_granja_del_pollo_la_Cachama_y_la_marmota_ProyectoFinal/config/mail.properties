mail.patient.creation.subject=Bienvenido/a a Bosque Health
mail.patient.creation.body=Estimado/a {nombrePaciente}: \n\nLe informamos que ha sido registrado/a con éxito en nuestra base de datos. A continuación, le proporcionamos algunos detalles importantes:\n\nNúmero de identificación: {numeroIdentificacion} \nCorreo de contacto: {correo} \n¡Gracias por confiar en nosotros para su cuidado de salud!\nAtentamente, \nBosque Health

mail.doctor.welcome.subject=Bienvenido/a a nuestro equipo médico
mail.doctor.welcome.body=Estimado/a Dr./Dra. {nombreDoctor}: \n\nNos complace darle la bienvenida a nuestro equipo en la especialidad de {especialidad}. A continuación, le proporcionamos algunos detalles importantes:\n\nNúmero de identificación: {numeroIdentificacion} \nCorreo de contacto: {correoDoctor} \n\nEstamos seguros de que su experiencia y habilidades serán un gran aporte para nuestra institución. ¡Bienvenido/a!\n\nAtentamente, \nBosque Health

mail.patient.update.subject=Confirmación de actualización de sus datos
mail.patient.update.body=Estimado/a {nombrePaciente}: \n\nLe informamos que sus datos han sido actualizados con éxito en nuestro sistema. A continuación, le compartimos los datos actualizados:\n\nNúmero de identificación: {numeroIdentificacion} \nCorreo de contacto: {correoPaciente} \nEdad: {edadPaciente} \n\nSi necesita realizar alguna otra modificación, no dude en contactarnos.\n\nAtentamente, \nBosque Health

mail.doctor.update.subject=Confirmación de actualización de sus datos en nuestro sistema
mail.doctor.update.body=Estimado/a Dr./Dra. {nombreDoctor}: \n\nLe informamos que sus datos han sido actualizados con éxito en nuestro sistema. A continuación, le compartimos los datos actuales:\n\nNúmero de identificación: {numeroIdentificacion} \nCorreo de contacto: {correoDoctor} \nEspecialidad: {especialidad} \n\nSi necesita realizar alguna otra modificación, no dude en contactarnos.\nAtentamente, \nBosque Health

mail.appointment.scheduled.subject=Confirmación de su cita médica agendada
mail.appointment.scheduled.body=Estimado/a {nombrePaciente}: \n\nLe confirmamos que su cita (número: {numeroCita}) ha sido agendada con éxito. A continuación, le compartimos los detalles:\n\nNúmero de identificación: {numeroIdentificacion} \nEspecialidad: {especialidadCita} \nDoctor que atenderá: Dr./Dra. {nombreDoctor} \nFecha de la cita: {fechaCita} \n\nLe recomendamos llegar con al menos 15 minutos de anticipación para realizar el registro. Si por algún motivo no puede asistir a la cita, le agradecemos nos lo informe con la mayor antelación posible.\nQuedamos a su disposición para cualquier pregunta o inquietud sobre su cita.\n\nAtentamente, \nBosque Health

mail.appointment.rescheduled.subject=Confirmación de reagendamiento de su cita médica
mail.appointment.rescheduled.body=Estimado/a {nombrePaciente}: \n\nLe informamos que su cita (número: {numeroCita}) ha sido reagendada con exito. A continuación, le compartimos los nuevos detalles:\n\nEspecialidad: {especialidadCita} \nDoctor que atenderá: Dr./Dra. {nombreDoctor} \nNueva fecha de la cita: {nuevaFechaCita} \n\nSi necesita realizar algún ajuste o tiene preguntas sobre esta reprogramación, no dude en contactarnos.\n\nAtentamente, \nBosque Health

mail.appointment.canceled.subject=Notificación de cancelación de su cita médica
mail.appointment.canceled.body=Estimado/a {nombrePaciente}: \n\nLe informamos que su cita ha sido cancelada. A continuación, le compartimos los detalles:\n\nNúmero de identificación: {numeroIdentificacion} \nEspecialidad de la cita: {especialidadCita} \nNúmero de cita cancelada: {numeroCita} \nFecha de la cita cancelada: {fechaCita} \n\nLamentamos los inconvenientes que esto pueda causar. Si desea reagendar la cita, por favor contáctenos.\n\nAtentamente, \nBosque Health

