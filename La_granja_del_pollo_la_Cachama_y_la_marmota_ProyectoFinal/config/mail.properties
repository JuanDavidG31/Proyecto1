mail.schedule.assigned.body=Estimado/a Dr./Dra. {nombreDoctor}: \n\nLe informamos que se le ha asignado un nuevo turno. A continuación, le compartimos los detalles:\n\nIdentificación: {numeroIdentificacion} \nEspecialidad: {especialidad} \nFecha de inicio del turno: {fechaInicio} \nFecha de fin del turno: {fechaFin} \n\nPor favor, asegúrese de cumplir con los horarios establecidos y contáctenos si tiene alguna duda sobre esta asignación.\n\nAtentamente, \nBosque Health

mail.schedule.change.person1.subject=Notificación de cambio de turn
mail.schedule.change.person1.body=Estimado/a Dr./Dra. {nombre1}: \n\nLe informamos que su turno ha sido reasignado. A continuación, le compartimos los detalles del cambio:\n\nIdentificación: {numeroIdentificacion} \nEspecialidad: {especialidad} \nFecha del antiguo turno: {fechaAntiguoTurno} \nFecha del nuevo turno: {fechaNuevoTurno} \n\nEste cambio fue realizado por: Dr./Dra. {nombre2} \n\nLe agradecemos su comprensión. Si tiene alguna pregunta o inquietud, no dude en ponerse en contacto con nosotros.\n\nAtentamente, \nBosque Health
